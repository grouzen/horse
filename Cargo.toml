[package]
name = "horse"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = { package = "rig-core", version = "0.30.0" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
color-eyre = "0.6"
thiserror = "1"
termimad = "0.32"
owo-colors = "4"
indicatif = "0.17"
async-trait = "0.1.89"
lazy_static = "1.4"
regex = "1.10"

[features]
default = ["all-providers"]
all-providers = [
    "provider-anthropic",
    "provider-azure",
    "provider-cohere",
    "provider-deepseek",
    "provider-galadriel",
    "provider-gemini",
    "provider-groq",
    "provider-huggingface",
    "provider-hyperbolic",
    "provider-mira",
    "provider-mistral",
    "provider-moonshot",
    "provider-ollama",
    "provider-openai",
    "provider-openrouter",
    "provider-perplexity",
    "provider-together",
    "provider-xai",
]
provider-anthropic = []
provider-azure = []
provider-cohere = []
provider-deepseek = []
provider-galadriel = []
provider-gemini = []
provider-groq = []
provider-huggingface = []
provider-hyperbolic = []
provider-mira = []
provider-mistral = []
provider-moonshot = []
provider-ollama = []
provider-openai = []
provider-openrouter = []
provider-perplexity = []
provider-together = []
provider-xai = []
